name: Build & Release APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Bump versionName and versionCode
        run: |
          VER="1.7.${{ github.run_number }}"
          CODE=$((100 + ${{ github.run_number }}))
          echo "APP_VER=$VER" >> $GITHUB_ENV
          sed -i -E "s/versionName[[:space:]]*=[[:space:]]*\"[^\"]+\"/versionName = \"$VER\"/" android/app/build.gradle*
          sed -i -E "s/versionName[[:space:]]+\"[^\"]+\"/versionName \"$VER\"/" android/app/build.gradle*
          sed -i -E "s/versionCode[[:space:]]*=[[:space:]]*[0-9]+/versionCode = $CODE/" android/app/build.gradle*
          sed -i -E "s/versionCode[[:space:]]+[0-9]+/versionCode $CODE/" android/app/build.gradle*

      - name: Cache debug keystore for consistent signing
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Make gradlew executable
        run: chmod +x android/gradlew
        continue-on-error: true

      - name: Build Debug APK
        working-directory: android
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Rename APK for GigFlow Updater
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "GigFlow-${{ env.APP_VER }}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: GigFlow-${{ env.APP_VER }}
          path: GigFlow-${{ env.APP_VER }}.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VER }}
          name: GigFlow v${{ env.APP_VER }}
          body: Automated build from commit ${{ github.sha }}
          files: GigFlow-${{ env.APP_VER }}.apk
