name: Build & Release APK

on:
  # Pushes only compile. Releases are cut on purpose (manual dispatch).
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 1.8.0. Leave blank to bump the patch of the latest tag.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: apk-build
  cancel-in-progress: false

jobs:
  # Compile check on every push — no version bump, no tag, no release.
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle with dependency caching
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK and run parser tests
        working-directory: android
        run: |
          set -o pipefail
          LOG="$RUNNER_TEMP/gradle-build.log"
          for attempt in 1 2; do
            if ./gradlew --no-daemon assembleDebug testDebugUnitTest 2>&1 | tee "$LOG"; then exit 0; fi
            if [ "$attempt" = 2 ]; then exit 1; fi
            if grep -qiE "429|Could not resolve|Could not GET|timed out|Connection reset" "$LOG"; then
              echo "::warning::Transient dependency failure (Maven Central) on attempt $attempt — retrying once in 30s"
              sleep 30
            else
              exit 1
            fi
          done

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: Shiftlit-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # Manual only: bump, sign, publish.
  release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compute next version
        id: ver
        run: |
          set -euo pipefail
          GRADLE=android/app/build.gradle.kts
          INPUT="${{ inputs.version }}"
          INPUT="${INPUT#v}"

          if [ -n "$INPUT" ]; then
            VER="$INPUT"
          else
            FILE_VER=$(sed -nE 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$GRADLE" | head -1)
            TAG_VER=$(git tag -l 'v*' --sort=-v:refname | head -1 | sed 's/^v//')
            BASE=$(printf '%s\n%s\n' "${FILE_VER:-0.0.0}" "${TAG_VER:-0.0.0}" | sort -V | tail -1)
            MAJOR=$(echo "$BASE" | cut -d. -f1)
            MINOR=$(echo "$BASE" | cut -d. -f2)
            PATCH=$(echo "$BASE" | cut -d. -f3)
            PATCH=$(( ${PATCH:-0} + 1 ))
            # Base-100 rollover: the patch field is never allowed to reach 100,
            # so 1.7.99 becomes 1.8.0 instead of a colliding 1.7.100.
            if [ "$PATCH" -ge 100 ]; then PATCH=0; MINOR=$(( MINOR + 1 )); fi
            if [ "$MINOR" -ge 100 ]; then MINOR=0; MAJOR=$(( MAJOR + 1 )); fi
            VER="$MAJOR.$MINOR.$PATCH"
          fi

          if ! echo "$VER" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$VER' is not a valid version (expected MAJOR.MINOR.PATCH)"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VER" >/dev/null; then
            echo "::error::tag v$VER already exists — pick a new version"
            exit 1
          fi

          MAJOR=$(echo "$VER" | cut -d. -f1)
          MINOR=$(echo "$VER" | cut -d. -f2)
          PATCH=$(echo "$VER" | cut -d. -f3)
          # major*10000 + minor*100 + patch is injective only while minor and
          # patch stay below 100; auto-releases roll over, explicit ones must comply.
          if [ "$MINOR" -ge 100 ] || [ "$PATCH" -ge 100 ]; then
            echo "::error::$VER cannot be encoded without a versionCode collision. Keep minor and patch below 100, e.g. $(( MAJOR + 1 )).0.0."
            exit 1
          fi
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "releasing $VER ($CODE)"

      - name: Stamp version into build.gradle
        run: |
          GRADLE=android/app/build.gradle.kts
          sed -i -E "s/versionName[[:space:]]*=[[:space:]]*\"[^\"]+\"/versionName = \"${{ steps.ver.outputs.version }}\"/" "$GRADLE"
          sed -i -E "s/versionCode[[:space:]]*=[[:space:]]*[0-9]+/versionCode = ${{ steps.ver.outputs.code }}/" "$GRADLE"
          grep -nE 'versionName|versionCode' "$GRADLE"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. Add the four signing secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) — see README → Releasing."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      - name: Set up Gradle with dependency caching
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build signed Release APK
        working-directory: android
        env:
          GIGFLOW_KEYSTORE: ${{ runner.temp }}/release.jks
          GIGFLOW_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          GIGFLOW_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          GIGFLOW_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          LOG="$RUNNER_TEMP/gradle-build.log"
          for attempt in 1 2; do
            # Tests gate the release too: the replay suite is what guarantees a
            # taught hint can't change a screen that already parses.
            if ./gradlew --no-daemon assembleRelease testDebugUnitTest 2>&1 | tee "$LOG"; then exit 0; fi
            if [ "$attempt" = 2 ]; then exit 1; fi
            if grep -qiE "429|Could not resolve|Could not GET|timed out|Connection reset" "$LOG"; then
              echo "::warning::Transient dependency failure (Maven Central) on attempt $attempt — retrying once in 30s"
              sleep 30
            else
              exit 1
            fi
          done

      - name: Verify signature
        env:
          # SHA-256 of the release key inside release.jks (alias "gigflow").
          # This is pinned on purpose: re-keying silently breaks in-place
          # updates for every installed copy, so a changed key must be a
          # deliberate, reviewed edit to this line — never an accident.
          EXPECTED_CERT_SHA256: c27f31c698ff74b57b36cd87dd9aef9bbb00a59161ffc324475e46c5a73eb715
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          CERTS=$("$APKSIGNER" verify --print-certs "$APK")
          printf '%s\n' "$CERTS" | grep -iE "certificate (DN|SHA-256)" | head -4 || true
          ACTUAL=$(printf '%s\n' "$CERTS" \
            | sed -nE 's/.*certificate SHA-256 digest: *([0-9a-fA-F:]+).*/\1/p' \
            | head -1 | tr -d ':' | tr 'A-F' 'a-f')
          if [ -z "$ACTUAL" ]; then
            echo "::error::Could not read a signing certificate from the APK."
            exit 1
          fi
          echo "APK certificate SHA-256: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK is signed by $ACTUAL but the pinned release key is $EXPECTED_CERT_SHA256. Installing this would fail over every existing copy — refusing to publish."
            exit 1
          fi
          echo "Signature certificate matches the pinned release key."

      - name: Assert APK identity
        env:
          EXPECTED_PACKAGE: app.gigflow.driver
          EXPECTED_CODE: ${{ steps.ver.outputs.code }}
          EXPECTED_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)
          BADGING=$("$AAPT2" dump badging "$APK")
          PKG=$(printf '%s\n' "$BADGING" | sed -nE "s/^package: name='([^']+)'.*/\1/p")
          CODE=$(printf '%s\n' "$BADGING" | sed -nE "s/.*versionCode='([0-9]+)'.*/\1/p")
          NAME=$(printf '%s\n' "$BADGING" | sed -nE "s/.*versionName='([^']+)'.*/\1/p")
          echo "APK package=$PKG versionName=$NAME versionCode=$CODE"
          if [ "$PKG" != "$EXPECTED_PACKAGE" ]; then
            echo "::error::APK package is '$PKG', expected '$EXPECTED_PACKAGE' (a .debug build would install as a separate app)"
            exit 1
          fi
          if [ "$CODE" != "$EXPECTED_CODE" ]; then
            echo "::error::APK versionCode is '$CODE', expected '$EXPECTED_CODE'"
            exit 1
          fi
          if [ "$NAME" != "$EXPECTED_VERSION" ]; then
            echo "::error::APK versionName is '$NAME', expected '$EXPECTED_VERSION'"
            exit 1
          fi
          echo "APK identity matches the release version."

      - name: Rename APK for the updater
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "Shiftlit-${{ steps.ver.outputs.version }}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: Shiftlit-${{ steps.ver.outputs.version }}
          path: Shiftlit-${{ steps.ver.outputs.version }}.apk

      - name: Commit version bump
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/build.gradle.kts
          # Idempotent: a retried run may find the version already committed.
          if git diff --staged --quiet; then
            echo "build.gradle already at $VER — no bump commit needed"
          else
            git commit -m "Release v$VER"
            git push origin "HEAD:master"
          fi
          if git ls-remote --tags origin "refs/tags/v$VER" | grep -q .; then
            echo "tag v$VER already exists on remote"
          else
            git tag "v$VER"
            git push origin "refs/tags/v$VER"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Shiftlit v${{ steps.ver.outputs.version }}
          body: Automated build from commit ${{ github.sha }}
          files: Shiftlit-${{ steps.ver.outputs.version }}.apk
